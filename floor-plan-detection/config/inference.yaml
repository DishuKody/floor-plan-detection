input:
  render_scale: 1.5            # reference raster = page rendered at 1.5 px/pt; all pixel outputs are in this frame
drawing:
  scale_ratio: 100             # printed scale 1:N (not stored as text in these PDFs: set it in the sheet profile); scales every pt parameter below (tuned at 1:100) and the m2
vector:
  # roi / footprint: absent = derived from the drawing (src/vector/calibrate.plan_footprint); a sheet profile may fix them
  raster_px_per_pt: 4
  # min_wall_stroke: absent = 1.5 x the sheet's dominant line weight (furniture / hatching ink); a profile may fix it
  wall_channel_close_pt: 3.5   # fills the interior of double-line walls
  min_inscribed_radius_pt: 7   # regions thinner than this are wall cavities / window strips, not rooms
  min_area_pt2: 30
  min_room_area_m2: 1.0        # smaller regions (kitchen-unit niches, jamb pockets) are listed in debug/discarded_fragments.json, not output as rooms
  door_arc: {r_min: 12, r_max: 40, sweep_min: 60, sweep_max: 120}
  remove_tread_series: true    # v2: equally spaced parallel tread lines (>=5) are symbol linework, not walls
  extend_walls: {min_len: 40, max_ext: 30}
  mouth_closure: {enabled: false, min_gap_m: 1.2, max_gap_m: 12.0, pocket_area_m2: [4.0, 150.0], depth_m: 16.0, min_branch_m: 0.6}   # v7 EXPERIMENT (off): links between wall tips; mean IoU 0.517 to 0.554 but several wrong long links, see review_v7.md
  long_thin_lines: {enabled: true, min_len_m: 4.0}   # v6: long straight strokes in the clutter weight inside the building = glazed screens / partitions
  dash_chains: {enabled: true, min_chain: 6, min_gap_pt: 1.0, max_gap_m: 6.0, gap_tol: 0.5}   # v6: dash / dash-dot lines at any angle and weight are not walls
  gap_closing: {enabled: true, max_gap_m: 3.0, pair_gap_m: 12.0, min_end_branch_m: 2.0}   # direction-agnostic extension of dangling wall ends (needed for diagonal / curved plans)
ocr:
  enabled: true
  tile_px: 1600
  overlap_px: 200
  upscale: 3.0
  min_score: 0.5
  # cudnn_algo_search: HEURISTIC  # optional GPU-only patch of RapidOCR EXHAUSTIVE search; measured NO speed difference here, so disabled
instances:
  open_plan_split: {enabled: true, min_area_m2: 100, min_seeds: 2, seed_mode: text, min_letters: 2, core_seeds: true, reach_m: 0, trim_frac: 0.6, cluster_m: 4.0}   # v7: split regions that hold several named rooms / open space from text seeds (+ distance-transform core seeds); trim thin spill-over strips; flagged
  split_by_labels: false       # label-guided watershed split of regions holding >=2 unit-ID labels (see report: not independent of proxy metric)
fixtures:
  px_per_pt: 3
  thresh: 0.80                 # normalised cross-correlation of the thin-line layer (CAD blocks match at ~0.95-1.0)
  # pod_exemplars / extra_search_boxes: sheet-specific CAD symbol exemplars, provided by a sheet profile
structural_pass:
  enabled: true
  keywords: ["stair", "lift", "riser", "aov"]   # named spaces re-segmented from thick structural walls only
  area_m2: [1.0, 60.0]
adoption:
  enabled: true                # v2: attach small unlabelled pockets (<4 m2) to the bedroom or bathroom they share the longest boundary with
  max_area_m2: 4.0
  min_shared_pt: 8.0
windows:
  px_per_pt: 3
  w_range: [0.4, 0.56]         # window glazing is drawn at 0.48pt
  thresh: 0.75
  band_pt: 30                  # windows are accepted only within this distance of the building footprint boundary (south wall sits ~22pt inside the footprint rectangle)
  # exemplars: sheet-specific window symbol boxes from a sheet profile; without them window_elements() (stroke band at the footprint) is used
circulation_rule:
  enabled: true                # unlabelled 3-10 m2 room touching a corridor/lobby -> corridor_or_hallway (low score, review flagged; NOT measured)
  min_area_m2: 3.0
  max_area_m2: 10.0
  max_gap_pt: 2.0
compute:
  device: auto                 # auto = CUDA when PyTorch sees a GPU (template matching + OCR), else CPU. 'cpu' / 'cuda' force it.
raster:
  render_scale: 2.0            # page render scale (px/pt) of the full-page overlay / mask for raster-only PDFs
  footprint_close_frac: 0.12   # closing kernel (fraction of image width) for the outline of the wall cluster (bridges open verandas)
  door_gap_frac: 0.11          # wall ends facing ANY wall within this fraction of the image width are joined (door thresholds)
  pair_gap_frac: 0.27          # larger openings are joined only between two wall ends that face each other
  rectilinear_walls: true      # wall-end extension only along the two image axes (set false for plans with angled walls)
